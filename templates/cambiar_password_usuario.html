{% extends "base.html" %}

{% block title %}
Cambiar contraseña
{% endblock %}

{% block contenido %}

<header class="encabezado">

    <div>
        <h1>Cambiar contraseña</h1>

        <p class="subtitulo">
            Usuario: {{ usuario["nombre"] }}
            ({{ usuario["usuario"] }})
        </p>
    </div>

    <a
        href="{{ url_for('usuarios') }}"
        class="boton-secundario"
    >
        ← Volver
    </a>

</header>

<section class="panel">

    {% if error %}

        <div class="mensaje-error">
            {{ error }}
        </div>

    {% endif %}

    <form method="POST">

        <div class="formulario-grid">

            <div>
                <label for="password">
                    Nueva contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div>
                <label for="confirmacion">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="confirmacion"
                    name="confirmacion"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

        </div>

        <div class="filtros-botones">

            <button
                type="submit"
                class="boton"
            >
                Cambiar contraseña
            </button>

            <a
                href="{{ url_for('usuarios') }}"
                class="boton-secundario"
            >
                Cancelar
            </a>

        </div>

    </form>

</section>

{% endblock %}
