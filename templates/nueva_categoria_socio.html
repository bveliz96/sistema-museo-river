{% extends "base.html" %}

{% block title %}
Nueva categoría de socio
{% endblock %}


{% block contenido %}

<header class="encabezado">

    <div>

        <h1>
            Nueva categoría de socio
        </h1>

        <p class="subtitulo">
            Crear una nueva categoría para los asociados
        </p>

    </div>


    <a
        href="{{ url_for('categorias_socio') }}"
        class="boton-secundario"
    >
        ← Volver
    </a>

</header>


<section class="panel">

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >


        <div class="formulario-grid">

            <div class="campo campo-completo">

                <label for="nombre">
                    Nombre de la categoría *
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ej. SOCIO ACTIVO"
                    required
                    autofocus
                >

            </div>

        </div>


        <div class="formulario-acciones">

            <button
                type="submit"
                class="boton"
            >
                Guardar categoría
            </button>

            <a
                href="{{ url_for('categorias_socio') }}"
                class="boton-secundario"
            >
                Cancelar
            </a>

        </div>

    </form>

</section>

{% endblock %}
