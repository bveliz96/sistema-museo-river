{% extends "base.html" %}

{% block title %}
Editar tipo de visita
{% endblock %}


{% block contenido %}

<header class="encabezado">

    <div>

        <h1>Editar Tipo de Visita</h1>

        <p class="subtitulo">
            Modificar el nombre del tipo de visita
        </p>

    </div>

    <a
        href="{{ url_for('tipos_visita') }}"
        class="boton-secundario"
    >
        ← Volver
    </a>

</header>


<section class="panel">

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >


        <div class="formulario-grid">

            <div class="campo">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    value="{{ tipo['nombre'] }}"
                    required
                    autofocus
                >

            </div>

            <div class="campo">

                <label for="circuito_recepcion">
                    Circuito en recepción
                </label>

                <select
                    id="circuito_recepcion"
                    name="circuito_recepcion"
                >

                    <option
                        value=""
                        {% if not tipo["circuito_recepcion"] %}
                            selected
                        {% endif %}
                    >
                        Sin configurar
                    </option>

                    <option
                        value="ESTADIO"
                        {% if tipo["circuito_recepcion"] == "ESTADIO" %}
                            selected
                        {% endif %}
                    >
                        Estadio
                    </option>

                    <option
                        value="TRIBUNA"
                        {% if tipo["circuito_recepcion"] == "TRIBUNA" %}
                            selected
                        {% endif %}
                    >
                        Tribuna
                    </option>

                    <option
                        value="MUSEO"
                        {% if tipo["circuito_recepcion"] == "MUSEO" %}
                            selected
                        {% endif %}
                    >
                        Museo
                    </option>

                </select>

            </div>

        </div>


        <div class="formulario-acciones">

            <button
                type="submit"
                class="boton"
            >
                Guardar cambios
            </button>

            <a
                href="{{ url_for('tipos_visita') }}"
                class="boton-secundario"
            >
                Cancelar
            </a>

        </div>

    </form>

</section>

{% endblock %}
