{% extends "base.html" %}

{% block title %}
Editar tipo de visita
{% endblock %}


{% block contenido %}

<header class="encabezado">

    <div>

        <h1>Editar Tipo de Visita</h1>

        <p class="subtitulo">
            Modificar el nombre del tipo de visita
        </p>

    </div>

    <a
        href="{{ url_for('tipos_visita') }}"
        class="boton-secundario"
    >
        ← Volver
    </a>

</header>


<section class="panel">

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >


        <div class="formulario-grid">

            <div class="campo">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    value="{{ tipo['nombre'] }}"
                    required
                    autofocus
                >

            </div>

        </div>


        <div class="formulario-acciones">

            <button
                type="submit"
                class="boton"
            >
                Guardar cambios
            </button>

            <a
                href="{{ url_for('tipos_visita') }}"
                class="boton-secundario"
            >
                Cancelar
            </a>

        </div>

    </form>

</section>

{% endblock %}
