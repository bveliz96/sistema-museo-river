{% extends "base.html" %}

{% block title %}
Nuevo usuario
{% endblock %}


{% block contenido %}

<header class="encabezado">

    <div>

        <h1>Nuevo Usuario</h1>

        <p class="subtitulo">
            Crear un acceso al sistema
        </p>

    </div>

</header>


<section class="panel">

    {% if error %}

        <div class="mensaje-error">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <div class="formulario-grid">

            <div class="campo campo-completo">

                <label for="nombre">
                    Nombre completo *
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    required
                    autofocus
                >

            </div>


            <div class="campo">

                <label for="usuario">
                    Nombre de usuario *
                </label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    required
                    autocomplete="off"
                >

            </div>


            <div class="campo">

                <label for="rol">
                    Rol *
                </label>

                <select
                    id="rol"
                    name="rol"
                    required
                >

                    <option value="OPERADOR">
                        Operador
                    </option>

                    <option value="ADMIN">
                        Administrador
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="password">
                    Contraseña *
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="new-password"
                >

            </div>


            <div class="campo">

                <label for="confirmacion">
                    Repetir contraseña *
                </label>

                <input
                    type="password"
                    id="confirmacion"
                    name="confirmacion"
                    required
                    autocomplete="new-password"
                >

            </div>

        </div>


        <div class="formulario-acciones">

            <a
                href="{{ url_for('usuarios') }}"
                class="boton-secundario"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="boton"
            >
                Guardar usuario
            </button>

        </div>

    </form>

</section>

{% endblock %}
