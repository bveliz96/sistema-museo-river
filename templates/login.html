<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/estilos.css') }}"
    >

</head>


<body class="pagina-login">

    <main class="login-contenedor">

        <section class="login-panel">

            <div class="login-encabezado">

                <h1>Museo River</h1>

                <p>
                    Ingresá con tu usuario para continuar
                </p>

            </div>


            {% if error %}

                <div class="mensaje-error">
                    {{ error }}
                </div>

            {% endif %}


            <form method="POST">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <div class="campo">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        required
                        autofocus
                        autocomplete="username"
                    >

                </div>


                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                    >

                </div>


                <button
                    type="submit"
                    class="boton login-boton"
                >
                    Ingresar
                </button>

            </form>

        </section>

    </main>

</body>

</html>
