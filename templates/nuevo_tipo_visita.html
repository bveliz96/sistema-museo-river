{% extends "base.html" %}

{% block title %}
Nuevo tipo de visita
{% endblock %}


{% block contenido %}

<header class="encabezado">

    <div>

        <h1>Nuevo Tipo de Visita</h1>

        <p class="subtitulo">
            Registrar un nuevo tipo de visita
        </p>

    </div>

    <a
        href="{{ url_for('tipos_visita') }}"
        class="boton-secundario"
    >
        ← Volver
    </a>

</header>


<section class="panel">

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >


        <div class="formulario-grid">

            <div class="campo">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    required
                    autofocus
                >

            </div>

            <div class="campo">

                <label for="circuito_recepcion">
                    Circuito en recepción
                </label>

                <select
                    id="circuito_recepcion"
                    name="circuito_recepcion"
                >

                    <option value="">
                        Sin configurar
                    </option>

                    <option value="ESTADIO">
                        Estadio
                    </option>

                    <option value="TRIBUNA">
                        Tribuna
                    </option>

                    <option value="MUSEO">
                        Museo
                    </option>

                </select>

            </div>

        </div>


        <div class="formulario-acciones">

            <button
                type="submit"
                class="boton"
            >
                Guardar
            </button>

            <a
                href="{{ url_for('tipos_visita') }}"
                class="boton-secundario"
            >
                Cancelar
            </a>

        </div>

    </form>

</section>

{% endblock %}
