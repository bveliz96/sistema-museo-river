{% extends "base.html" %}

{% block title %}
Editar protocolo
{% endblock %}


{% block contenido %}

<header class="encabezado">

    <h1>Editar Protocolo</h1>

</header>


<section class="panel">

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >


        <div class="campo">

            <label for="fecha">
                Fecha
            </label>

            <input
                type="date"
                id="fecha"
                name="fecha"
                value="{{ protocolo['fecha'] }}"
                required
            >

        </div>


        <div class="campo">

            <label for="tipo_protocolo_id">
                Tipo de protocolo
            </label>

            <select
                id="tipo_protocolo_id"
                name="tipo_protocolo_id"
                required
            >

                {% for tipo in tipos_protocolo %}

                    {% if
                        tipo["estado"] == "ACTIVO"
                        or tipo["id"] == protocolo["tipo_protocolo_id"]
                    %}

                        <option
                            value="{{ tipo['id'] }}"

                            {% if
                                tipo["id"] == protocolo["tipo_protocolo_id"]
                            %}
                                selected
                            {% endif %}
                        >
                            {{ tipo["nombre"] }}

                            {% if tipo["estado"] != "ACTIVO" %}
                                (Inactivo)
                            {% endif %}
                        </option>

                    {% endif %}

                {% endfor %}

            </select>

        </div>


        <div class="campo">

            <label for="tipo_visita_id">
                Tipo de visita
            </label>

            <select
                id="tipo_visita_id"
                name="tipo_visita_id"
                required
            >

                {% for tipo in tipos_visita %}

                    {% if
                        tipo["estado"] == "ACTIVO"
                        or tipo["id"] == protocolo["tipo_visita_id"]
                    %}

                        <option
                            value="{{ tipo['id'] }}"

                            {% if
                                tipo["id"] == protocolo["tipo_visita_id"]
                            %}
                                selected
                            {% endif %}
                        >
                            {{ tipo["nombre"] }}

                            {% if tipo["estado"] != "ACTIVO" %}
                                (Inactivo)
                            {% endif %}
                        </option>

                    {% endif %}

                {% endfor %}

            </select>

        </div>


        <div class="campo">

            <label for="cantidad">
                Cantidad de entradas
            </label>

            <input
                type="number"
                id="cantidad"
                name="cantidad"
                min="1"
                step="1"
                value="{{ protocolo['cantidad'] }}"
                required
            >

        </div>


        <div class="campo">

            <label for="descripcion">
                Descripción
            </label>

            <textarea
                id="descripcion"
                name="descripcion"
                rows="4"
            >{{ protocolo["descripcion"] or "" }}</textarea>

        </div>


        <div class="formulario-acciones">

            <button
                type="submit"
                class="boton"
            >
                Guardar cambios
            </button>

            <a
                href="{{ url_for('protocolos') }}"
                class="boton-secundario"
            >
                Cancelar
            </a>

        </div>

    </form>

</section>

{% endblock %}
